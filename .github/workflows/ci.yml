# Runs on every push and pull request: compiles the backend and runs the
# unit tests. PilliongoApplicationTests is skipped because it boots the
# whole app and needs a real MySQL database and secrets.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dtest='!PilliongoApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  # After the tests pass on main, package the backend as a Docker image
  # and store it in GitHub's container registry. The server then just
  # downloads the finished image; it never has to compile anything.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/raghupalnati/pilliongo-backend:latest
            ghcr.io/raghupalnati/pilliongo-backend:${{ github.sha }}
