spring.application.name=pilliongo

# Load secrets from a local, git-ignored .env file if it exists.
# Two paths so it works whether the app is started from this folder
# or from its parent (IntelliJ often uses D:\Downloads\pilliongo).
spring.config.import=optional:file:.env[.properties],optional:file:pilliongo/.env[.properties]

# Database. On your laptop the defaults below point at local MySQL. When
# deployed, set DB_URL / DB_USERNAME / DB_PASSWORD in the host's settings
# (works with MySQL and MySQL-compatible TiDB Cloud - see README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pilliongo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# How many database connections the app keeps open. Small free database
# plans allow only a few, so lower DB_POOL_SIZE there.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
# Printing every SQL query is useful when debugging but slows a busy
# server. Off by default; set SHOW_SQL=true in .env to see queries locally.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
# Hosting platforms tell the app which port to use through PORT.
server.port=${PORT:8080}

# Which website addresses may call this API (comma-separated). Add your
# deployed frontend, e.g. https://pilliongo.vercel.app. A * wildcard is
# allowed inside an address, e.g. https://*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.error.include-message=always

# JWT
# JWT_SECRET / MAIL_PASSWORD / DB_PASSWORD have NO default here on purpose,
# so no secret ever lives in source control. They come from real OS
# environment variables, or from a local .env file (git-ignored) that is
# loaded by the spring.config.import line at the top. See .env.example.
jwt.secret=${JWT_SECRET}
jwt.expiry=86400000

# Email (Brevo SMTP relay)
# MAIL_PASSWORD is your Brevo SMTP key, kept in .env (never in this file).
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=bc1ac7001@smtp-brevo.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Who emails come FROM (must be a verified sender in your Brevo account),
# and the inbox that receives in-app support notifications.
app.mail.from=PillionGo <pilliongo.app@gmail.com>
app.mail.support-inbox=pilliongo.app@gmail.com

# Map positions for locations, looked up on OpenStreetMap (free, no key).
# OSM asks every app to identify itself with a contact address.
app.geocoding.user-agent=PillionGo/1.0 (pilliongo.app@gmail.com)
# Optional: limit lookups to some countries, e.g. "in". Empty = worldwide.
app.geocoding.country-codes=