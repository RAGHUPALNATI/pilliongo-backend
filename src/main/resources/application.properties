spring.application.name=pilliongo

# Load secrets from a local, git-ignored .env file if it exists.
# Two paths so it works whether the app is started from this folder
# or from its parent (IntelliJ often uses D:\Downloads\pilliongo).
spring.config.import=optional:file:.env[.properties],optional:file:pilliongo/.env[.properties]
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pilliongo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080
server.error.include-message=always

# JWT
# JWT_SECRET / MAIL_PASSWORD / DB_PASSWORD have NO default here on purpose,
# so no secret ever lives in source control. They come from real OS
# environment variables, or from a local .env file (git-ignored) that is
# loaded by the spring.config.import line at the top. See .env.example.
jwt.secret=${JWT_SECRET}
jwt.expiry=86400000

# Email (Brevo SMTP relay)
# MAIL_PASSWORD is your Brevo SMTP key, kept in .env (never in this file).
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=bc1ac7001@smtp-brevo.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Who emails come FROM (must be a verified sender in your Brevo account),
# and the inbox that receives in-app support notifications.
app.mail.from=PillionGo <pilliongo.app@gmail.com>
app.mail.support-inbox=pilliongo.app@gmail.com

# Map positions for locations, looked up on OpenStreetMap (free, no key).
# OSM asks every app to identify itself with a contact address.
app.geocoding.user-agent=PillionGo/1.0 (pilliongo.app@gmail.com)
# Optional: limit lookups to some countries, e.g. "in". Empty = worldwide.
app.geocoding.country-codes=