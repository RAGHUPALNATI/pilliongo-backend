spring.application.name=pilliongo

# Load secrets from a local, git-ignored .env file if it exists.
# Two paths so it works whether the app is started from this folder
# or from its parent (IntelliJ often uses D:\Downloads\pilliongo).
spring.config.import=optional:file:.env[.properties],optional:file:pilliongo/.env[.properties]
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pilliongo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080
server.error.include-message=always

# JWT
# JWT_SECRET / MAIL_PASSWORD / DB_PASSWORD have NO default here on purpose,
# so no secret ever lives in source control. They come from real OS
# environment variables, or from a local .env file (git-ignored) that is
# loaded by the spring.config.import line at the top. See .env.example.
jwt.secret=${JWT_SECRET}
jwt.expiry=86400000

# Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pilliongo.app@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true